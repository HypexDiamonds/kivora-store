
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIVÓRA STORE | Free Fire</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080710;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:28px 18px;text-align:center;
 background:linear-gradient(135deg,#17102c,#080710);
 border-bottom:1px solid #753bce;
}
.logo{font-size:32px;font-weight:900;letter-spacing:4px}
.logo span{color:#ad70ff}
header p{color:#aaa;letter-spacing:4px;font-size:10px}
main{max-width:650px;margin:auto;padding:22px 16px}
h2{font-size:21px}
.subtitle{color:#aaa;font-size:13px}
.packages{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
 margin-top:20px;
}
.package{
 background:#151222;border:1px solid #302344;
 border-radius:13px;padding:17px 10px;
 text-align:center;cursor:pointer;
}
.package.selected{
 border:2px solid #a45cff;
 background:#211437;
}
.diamonds{font-size:22px;font-weight:bold}
.bonus{
 display:inline-block;background:#51248a;
 color:#e6ceff;padding:5px 9px;
 border-radius:20px;font-size:11px;
 margin:9px 0;
}
.receive{color:#c99aff;font-size:13px}
.price{font-size:16px;font-weight:bold;margin-top:10px}
label{display:block;margin:20px 0 8px;font-size:13px}
input,select{
 width:100%;padding:14px;border-radius:9px;
 background:#151222;color:white;
 border:1px solid #493365;font-size:15px;
}
button{
 width:100%;padding:15px;margin-top:20px;
 background:linear-gradient(90deg,#7438c9,#a45cff);
 border:0;border-radius:10px;color:white;
 font-size:16px;font-weight:bold;
}
.summary{
 margin-top:20px;padding:17px;
 background:#151222;border:1px solid #302344;
 border-radius:12px;line-height:1.9;
}
.muted{color:#aaa;font-size:12px}
footer{text-align:center;color:#777;font-size:11px;padding:25px}
</style>
</head>
<body>
<header>
 <div class="logo">KIVÓRA <span>STORE</span></div>
 <p>YOUR DIGITAL WORLD</p>
</header>

<main>
 <h2>💎 Recarga de diamantes</h2>
 <p class="subtitle">Selecciona tu paquete de Free Fire.</p>

 <div class="packages" id="packages"></div>

 <label for="player">ID de jugador</label>
 <input id="player" type="text" placeholder="Ingresa tu ID">

 <label for="region">Región de tu cuenta</label>
 <select id="region">
  <option value="Sudamérica">Sudamérica</option>
  <option value="Vietnam">Vietnam</option>
 </select>

 <div class="summary" id="summary">
  Selecciona un paquete para ver el resumen.
 </div>

 <button onclick="order()">CONTINUAR</button>

 <p class="muted">
  MODO DEMOSTRACIÓN: esta página todavía no procesa pagos
  ni entrega diamantes. No envíes dinero desde ella.
 </p>
</main>

<footer>KIVÓRA STORE © 2026</footer>

<script>
const products=[
 {amount:100,bonus:10,price:"S/ 3.50"},
 {amount:310,bonus:31,price:"S/ 10.00"},
 {amount:520,bonus:52,price:"S/ 16.50"},
 {amount:1060,bonus:106,price:"Consultar"},
 {amount:2180,bonus:218,price:"Consultar"},
 {amount:5600,bonus:560,price:"Consultar"}
];

let selected=0;

function render(){
 const container=document.getElementById("packages");
 container.innerHTML="";
 products.forEach((p,i)=>{
  const card=document.createElement("div");
  card.className="package"+(i===selected?" selected":"");
  card.innerHTML=`
   <div class="diamonds">💎 ${p.amount.toLocaleString("en-US")}</div>
   <div class="bonus">+10% BONUS</div>
   <div class="receive">Recibes ${ (p.amount+p.bonus).toLocaleString("en-US") }</div>
   <div class="price">${p.price}</div>`;
  card.onclick=()=>{selected=i;render();updateSummary()};
  container.appendChild(card);
 });
}

function updateSummary(){
 const p=products[selected];
 document.getElementById("summary").innerHTML=`
  <b>Resumen de compra</b><br>
  Paquete: ${p.amount.toLocaleString("en-US")} diamantes<br>
  Bonus: +${p.bonus.toLocaleString("en-US")} diamantes<br>
  <b>Recibes: ${(p.amount+p.bonus).toLocaleString("en-US")} diamantes</b><br>
  Precio: ${p.price}`;
}

function order(){
 const id=document.getElementById("player").value.trim();
 const region=document.getElementById("region").value;
 if(!id){alert("Ingresa tu ID de jugador.");return;}
 const p=products[selected];
 alert("PEDIDO DE DEMOSTRACIÓN\n"+
 "ID: "+id+"\n"+
 "Región: "+region+"\n"+
 "Paquete: "+p.amount+" diamantes\n"+
 "Bonus: +"+p.bonus+"\n"+
 "Recibes: "+(p.amount+p.bonus)+" diamantes\n"+
 "Precio: "+p.price+
 "\n\nEsta página aún no procesa pedidos reales.");
}

render();
updateSummary();
</script>
</body>
</html>
